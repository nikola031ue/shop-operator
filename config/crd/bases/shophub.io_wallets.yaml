apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: wallets.shophub.io
spec:
  group: shophub.io
  names:
    kind: Wallet
    listKind: WalletList
    plural: wallets
    singular: wallet
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              blockchain:
                enum:
                - ethereum
                - polygon
                type: string
              network:
                enum:
                - mainnet
                - testnet
                type: string
              secretRef:
                description: Reference to the Secret where the generated private key will be stored.
                properties:
                  name:
                    description: Name of the Secret.
                    type: string
                  namespace:
                    description: Namespace of the Secret.
                    type: string
                required:
                - name
                type: object
            required:
            - blockchain
            - network
            - secretRef
            type: object
          status:
            properties:
              address:
                type: string
              ready:
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
