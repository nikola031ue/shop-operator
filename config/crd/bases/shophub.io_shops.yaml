apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: shops.shophub.io
spec:
  group: shophub.io
  names:
    kind: Shop
    listKind: ShopList
    plural: shops
    singular: shop
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              name:
                type: string
              availability:
                enum:
                - standard
                - high
                type: string
              walletAddress:
                type: string
              databaseType:
                enum:
                - postgresql
                - redis
                type: string
              image:
                type: string
              ingressHost:
                type: string
            required:
            - name
            - availability
            - walletAddress
            - databaseType
            - image
            - ingressHost
            type: object
          status:
            properties:
              ready:
                type: boolean
              url:
                type: string
              replicas:
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
