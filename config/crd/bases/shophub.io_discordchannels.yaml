apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: discordchannels.shophub.io
spec:
  group: shophub.io
  names:
    kind: DiscordChannel
    listKind: DiscordChannelList
    plural: discordchannels
    singular: discordchannel
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              serverID:
                type: string
              channelName:
                type: string
              webhookSecretRef:
                description: Reference to the Kubernetes Secret containing the Discord bot token.
                properties:
                  name:
                    description: Name of the Secret.
                    type: string
                  key:
                    description: Key within the Secret.
                    type: string
                  optional:
                    description: Whether the Secret must exist.
                    type: boolean
                required:
                - name
                - key
                type: object
            required:
            - serverID
            - channelName
            - webhookSecretRef
            type: object
          status:
            properties:
              webhookURL:
                type: string
              channelID:
                type: string
              ready:
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
