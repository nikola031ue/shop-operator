apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: workspace
    app.kubernetes.io/managed-by: kustomize
  name: manager-role
rules:
- apiGroups:
  - shophub.io
  resources:
  - shops
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - shophub.io
  resources:
  - shops/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - shophub.io
  resources:
  - shops/finalizers
  verbs:
  - update
- apiGroups:
  - shophub.io
  resources:
  - discordchannels
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - shophub.io
  resources:
  - discordchannels/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - shophub.io
  resources:
  - discordchannels/finalizers
  verbs:
  - update
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
